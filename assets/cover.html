<!DOCTYPE html>
<!-- Source for cover.png, the library icon. Regenerate with tools/make-cover.sh. Black and white for e-ink. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 260px; height: 402px; background: #fff; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, "Times New Roman", serif; color: #000; }
  .title { font-weight: bold; font-size: 36px; margin-top: 10px; }
  .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
</style></head>
<body>
  <svg width="210" height="210" viewBox="0 0 210 210" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- folded newspaper behind the cup -->
    <g transform="rotate(-8 105 105)">
      <rect x="22" y="30" width="150" height="128" fill="#fff"/>
      <line x1="38" y1="52" x2="156" y2="52" stroke-width="10"/>
      <line x1="38" y1="74" x2="92" y2="74" stroke-width="4"/>
      <line x1="38" y1="88" x2="92" y2="88" stroke-width="4"/>
      <line x1="38" y1="102" x2="92" y2="102" stroke-width="4"/>
      <line x1="38" y1="116" x2="80" y2="116" stroke-width="4"/>
    </g>
    <!-- steam, with a white outline so it reads over the newspaper -->
    <g stroke="#fff" stroke-width="15">
      <path d="M120 58 c-8 -10 8 -16 0 -28"/>
      <path d="M140 58 c-8 -10 8 -16 0 -28"/>
      <path d="M160 58 c-8 -10 8 -16 0 -28"/>
    </g>
    <path d="M120 58 c-8 -10 8 -16 0 -28" stroke-width="5"/>
    <path d="M140 58 c-8 -10 8 -16 0 -28" stroke-width="5"/>
    <path d="M160 58 c-8 -10 8 -16 0 -28" stroke-width="5"/>
    <!-- cup -->
    <path d="M100 72 h80 v62 a34 34 0 0 1 -34 34 h-12 a34 34 0 0 1 -34 -34 z" fill="#fff"/>
    <path d="M180 88 h8 a16 16 0 0 1 0 32 h-8" />
    <!-- saucer -->
    <line x1="86" y1="182" x2="196" y2="182"/>
  </svg>
  <div class="title">Brew Reader</div>
  <div class="sub">unofficial</div>
</body></html>
